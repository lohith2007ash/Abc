<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Secure Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f0f2f5;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 380px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  }

  h2 {
    text-align: center;
    color: #1a1a1a;
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #6366f1;
  }

  .btn {
    width: 100%;
    padding: 12px;
    background: #6366f1;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 10px;
  }

  .btn:hover {
    background: #4f46e5;
  }

  .toggle-text {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #666;
  }

  .toggle-text span {
    color: #6366f1;
    font-weight: 600;
    cursor: pointer;
  }

  #message {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
  }

  .hidden { display: none; }
  
  .dashboard {
    text-align: center;
  }
</style>
</head>
<body>

<div class="card" id="auth-container">
  <h2 id="form-title">Welcome Back</h2>
  <form id="authForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required placeholder="At least 6 characters">
    </div>
    <button type="submit" class="btn" id="submit-btn">Login</button>
  </form>

  <div class="toggle-text" id="toggle-container">
    Don't have an account? <span onclick="toggleMode()">Sign up</span>
  </div>

  <div id="message"></div>
</div>

<div class="card hidden dashboard" id="dashboard-container">
  <h2>Dashboard</h2>
  <p id="user-display" style="color: #555; margin-bottom: 20px;"></p>
  <button class="btn" style="background: #ef4444;" onclick="handleLogout()">Logout</button>
</div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://fkfivwioztaxxabhjcba.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2cEFcU9E4kNcuvumeKJXAw_fBPfAFKM';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignUp = false;

// Check existing session on load
checkSession();

async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    showDashboard(session.user.email);
  }
}

// Toggle between Login and Sign Up
function toggleMode() {
  isSignUp = !isSignUp;
  document.getElementById('form-title').innerText = isSignUp ? 'Create Account' : 'Welcome Back';
  document.getElementById('submit-btn').innerText = isSignUp ? 'Sign Up' : 'Login';
  document.getElementById('toggle-container').innerHTML = isSignUp ? 
    'Already have an account? <span onclick="toggleMode()">Login</span>' : 
    'Don\'t have an account? <span onclick="toggleMode()">Sign up</span>';
  document.getElementById('message').innerText = '';
}

// Form Submit Handler using Supabase Auth
document.getElementById('authForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msgDiv = document.getElementById('message');

  msgDiv.innerText = 'Processing...';
  msgDiv.style.color = '#555';

  if (isSignUp) {
    // Secure Sign Up via Supabase Auth
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) {
      msgDiv.style.color = '#ef4444';
      msgDiv.innerText = error.message;
    } else {
      msgDiv.style.color = '#10b981';
      msgDiv.innerText = 'Account created successfully! You can now login.';
      toggleMode();
    }
  } else {
    // Secure Login via Supabase Auth
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      msgDiv.style.color = '#ef4444';
      msgDiv.innerText = error.message;
    } else {
      msgDiv.style.color = '#10b981';
      msgDiv.innerText = 'Login successful!';
      showDashboard(data.user.email);
    }
  }
});

// Logout function
async function handleLogout() {
  await supabaseClient.auth.signOut();
  document.getElementById('dashboard-container').classList.add('hidden');
  document.getElementById('auth-container').classList.remove('hidden');
  document.getElementById('authForm').reset();
  document.getElementById('message').innerText = '';
}

function showDashboard(email) {
  document.getElementById('auth-container').classList.add('hidden');
  document.getElementById('dashboard-container').classList.remove('hidden');
  document.getElementById('user-display').innerText = `Logged in as: ${email}`;
}
</script>

</body>
</html>
